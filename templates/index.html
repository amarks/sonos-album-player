<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sonos Album Player</title>

    <!-- PWA -->
    <meta name="theme-color" content="#0c0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Albums">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <style>
        :root {
            --bg: #0c0e14;          /* deep blue-slate, near black */
            --surface: #191d26;     /* cards / sidebar — a clear step up from --bg */
            --surface-2: #232834;
            --surface-3: #313747;
            --border: rgba(255,255,255,0.08);
            --text: #f3f5fa;
            --text-2: #9aa4b6;
            --text-3: #656e80;
            --accent: #34d399;      /* emerald — single accent for all primary actions */
            --accent-hover: #2fc78d;
            --accent-weak: rgba(52,211,153,0.15);
            --accent-border: rgba(52,211,153,0.55);
            --on-accent: #04140d;   /* dark text/icon on the bright accent, for legibility */
            --danger: #ff5c52;      /* used only on hover for destructive actions */
            --danger-weak: rgba(255,92,82,0.14);
            --shadow-card: 0 1px 2px rgba(0,0,0,0.45), 0 3px 10px rgba(0,0,0,0.30);
            --shadow-hover: 0 18px 44px rgba(0,0,0,0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { overflow-x: hidden; max-width: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;      /* track the actually-visible viewport (mobile Safari toolbars) */
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            grid-template-rows: 54px 1fr 88px;
            height: 100vh;
            height: 100dvh;
            max-width: 100%;
        }

        /* ── Header ──────────────────────────────── */
        .header {
            grid-column: 1 / -1;
            background: rgba(12,14,20,0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 14px;
            z-index: 100;
        }

        .header h1 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            margin-right: 4px;
        }

        .sort-controls {
            display: flex;
            gap: 2px;
            background: var(--surface-2);
            border-radius: 8px;
            padding: 3px;
        }

        .sort-btn {
            padding: 5px 13px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
            transition: all 0.15s;
        }

        .sort-btn:hover { color: var(--text); }

        .sort-btn.active {
            background: var(--surface-3);
            color: var(--text);
        }

        /* Speaker picker */
        .speaker-picker {
            position: relative;
            flex-shrink: 0;
        }

        .speaker-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 14px 6px 10px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            transition: background 0.15s;
            white-space: nowrap;
        }

        .speaker-btn:hover { background: var(--surface-3); }

        /* Keep a long group name from squeezing the search box */
        #speakerName {
            display: inline-block;
            max-width: 14em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: middle;
        }

        .speaker-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px;
            min-width: 190px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            display: none;
            z-index: 500;
        }

        .speaker-menu.open { display: block; }

        .speaker-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            transition: background 0.1s;
        }

        .speaker-option:hover { background: var(--surface-2); }
        .speaker-option.active { color: var(--accent); }

        .speaker-option-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .speaker-members {
            font-size: 11px;
            color: var(--text-3);
            line-height: 1.3;
        }

        .speaker-option.active .speaker-members { color: var(--accent); opacity: 0.7; }

        .speaker-option .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            margin-left: auto;
            flex-shrink: 0;
            opacity: 0;
        }

        .speaker-option.active .dot { opacity: 1; }
        .speaker-option-divider { border-top: 1px solid var(--surface-3); margin: 4px 0; }

        /* ── Queue sidebar ───────────────────────── */
        .queue-section {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .queue-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .queue-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-3);
        }

        .queue-buttons { display: flex; gap: 6px; }

        .play-queue-btn {
            padding: 5px 14px;
            background: var(--accent);
            color: var(--on-accent);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: background 0.15s;
        }

        .play-queue-btn:hover { background: var(--accent-hover); }

        .clear-btn {
            padding: 5px 11px;
            background: transparent;
            color: var(--text-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.15s;
        }

        .clear-btn:hover { color: var(--danger); border-color: var(--danger-weak); background: var(--danger-weak); }

        .queue-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-height: 0;
        }

        .queue-scroll.drag-over {
            background: var(--accent-weak);
            outline: 2px dashed var(--accent-border);
            outline-offset: -6px;
            border-radius: 8px;
        }

        .queue-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-3);
            font-size: 13px;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .queue-empty-icon { font-size: 28px; opacity: 0.4; }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 9px;
            background: var(--surface-2);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 7px 8px;
            cursor: grab;
            position: relative;
            transition: background 0.15s, border-color 0.15s;
            flex-shrink: 0;
        }

        .queue-item:hover { background: var(--surface-3); }
        .queue-item:active { cursor: grabbing; opacity: 0.5; }
        .queue-item.now-playing { border-color: var(--accent-border); }

        /* drop indicator when reordering the queue */
        .queue-item.drop-before::before,
        .queue-item.drop-after::after {
            content: '';
            position: absolute;
            left: 6px;
            right: 6px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            pointer-events: none;
        }
        .queue-item.drop-before::before { top: -3px; }
        .queue-item.drop-after::after  { bottom: -3px; }

        .queue-item img {
            width: 42px;
            height: 42px;
            border-radius: 5px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--surface-3);
        }

        .queue-item-info { flex: 1; min-width: 0; }

        .queue-item .q-title {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }

        .queue-item .q-artist {
            font-size: 11px;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .playing-indicator {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
            display: none;
        }

        .queue-item.now-playing .playing-indicator { display: block; }

        .remove-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--surface-3);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.15s;
            flex-shrink: 0;
            line-height: 1;
        }

        .queue-item:hover .remove-btn { opacity: 1; }
        .remove-btn:hover { background: var(--danger); }

        /* ── Albums section ──────────────────────── */
        .albums-section {
            overflow-y: auto;
            overflow-x: hidden;
            min-width: 0;
            background: var(--bg);
        }

        /* ── Genre chips ─────────────────────────── */
        .genre-bar {
            display: none;               /* shown only in Genre mode */
            flex-wrap: wrap;
            gap: 8px;
            position: sticky;
            top: 0;
            padding: 14px 20px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            z-index: 5;
        }

        .genre-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            border-radius: 16px;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .genre-chip:hover { color: var(--text); border-color: rgba(255,255,255,0.18); }

        .genre-chip.active {
            background: var(--accent);
            color: var(--on-accent);
            border-color: var(--accent);
            font-weight: 700;
        }

        .gc-count { font-size: 11px; opacity: 0.6; }
        .genre-chip.active .gc-count { opacity: 0.8; }

        .header-search {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            max-width: 520px;
        }

        .search-box {
            flex: 1;
            min-width: 0;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            background: var(--surface);
            color: var(--text);
            transition: border-color 0.15s, background 0.15s;
        }

        .search-box::placeholder { color: var(--text-3); }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-border);
            background: var(--surface-2);
        }

        .search-results { font-size: 12px; color: var(--text-3); white-space: nowrap; flex-shrink: 0; }

        /* Album grid */
        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 14px;
            padding: 20px;
        }

        .album-card {
            background: var(--surface);
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            position: relative;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
        }

        .album-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(255,255,255,0.14);
        }

        .album-art-wrap {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 1;
            background: var(--surface-2);
        }

        .album-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .add-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .album-card:hover .add-overlay { opacity: 1; }

        .add-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
            color: var(--on-accent);
            font-size: 26px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, background 0.15s;
            line-height: 1;
        }

        .add-btn:hover {
            transform: scale(1.1);
            background: var(--accent-hover);
        }

        .album-card .a-title {
            font-size: 13px;
            font-weight: 600;
            margin-top: 9px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
        }

        .album-card .a-artist {
            font-size: 12px;
            color: var(--text-2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 2px;
        }

        .album-card .a-meta {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 3px;
            display: flex;
            gap: 5px;
        }

        .a-meta span + span::before { content: '·'; margin-right: 5px; }

        /* ── Player bar ──────────────────────────── */
        .player-controls {
            grid-column: 1 / -1;
            background: rgba(14,16,22,0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
        }

        .now-playing-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .np-art {
            width: 54px;
            height: 54px;
            border-radius: 6px;
            object-fit: cover;
            background: var(--surface-2);
            flex-shrink: 0;
        }

        .np-text { min-width: 0; }

        .np-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }

        .np-artist {
            font-size: 12px;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .controls-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-2);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .control-btn:hover { color: var(--text); background: var(--surface-2); }

        .control-btn svg { width: 20px; height: 20px; display: block; }

        .control-btn.play-pause {
            width: 52px;
            height: 52px;
            background: var(--text);
            color: #000;
            font-size: 20px;
        }

        .control-btn.play-pause:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-end;
        }

        .volume-icon { color: var(--text-3); font-size: 14px; flex-shrink: 0; }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 3px;
            border-radius: 2px;
            background: var(--surface-3);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--text);
            cursor: pointer;
            transition: transform 0.15s;
        }

        .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .volume-label {
            font-size: 12px;
            color: var(--text-3);
            width: 30px;
            text-align: right;
            background: transparent;
            border: none;
            outline: none;
            cursor: text;
            padding: 2px 3px;
            border-radius: 4px;
        }

        .volume-label:focus {
            background: var(--surface-2);
            color: var(--text);
        }

        /* hide number input spinners */
        .volume-label::-webkit-inner-spin-button,
        .volume-label::-webkit-outer-spin-button { -webkit-appearance: none; }

        /* ── Modal ───────────────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.7);
            max-width: 540px;
            max-height: 80vh;
            width: 90%;
            overflow: hidden;
            animation: slideUp 0.22s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(24px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            gap: 18px;
            padding: 22px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
            position: relative;
        }

        .modal-cover {
            width: 96px;
            height: 96px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--surface-3);
        }

        .modal-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            min-width: 0;
        }

        .modal-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--text);
        }

        .modal-artist { font-size: 14px; color: var(--text-2); }
        .modal-genre  { font-size: 12px; color: var(--text-3); }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 26px;
            height: 26px;
            border: none;
            background: var(--surface-3);
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-2);
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .modal-close:hover { color: var(--text); background: var(--surface-3); }

        .modal-body {
            overflow-y: auto;
            max-height: calc(80vh - 220px);
        }

        .track-list { list-style: none; }

        .track-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 22px;
            border-bottom: 1px solid var(--border);
            transition: background 0.12s;
        }

        .track-item:hover { background: var(--surface-2); }
        .track-item:last-child { border-bottom: none; }

        .track-number {
            font-size: 12px;
            color: var(--text-3);
            width: 22px;
            text-align: right;
            flex-shrink: 0;
        }

        .track-title { font-size: 14px; color: var(--text); flex: 1; }

        /* Remove button shown in the modal's queue mode (tap target for touch). */
        .track-remove {
            margin-left: auto;
            width: 28px; height: 28px;
            flex-shrink: 0;
            border: none; border-radius: 50%;
            background: var(--surface-3);
            color: white;
            cursor: pointer;
            font-size: 17px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
        }
        .track-remove:hover, .track-remove:active { background: var(--danger); }

        .modal-footer {
            padding: 14px 22px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
        }

        .modal-footer span { font-size: 13px; color: var(--text-3); }

        .add-to-queue-btn {
            padding: 9px 20px;
            background: var(--accent);
            color: var(--on-accent);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.15s;
        }

        .add-to-queue-btn:hover { opacity: 0.85; }

        /* ── Hover preview card ──────────────────── */
        .hovercard {
            position: fixed;
            z-index: 900;
            background: var(--surface-2);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.75), 0 2px 8px rgba(0,0,0,0.5);
            padding: 12px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.14s ease, transform 0.14s ease;
            display: none;
        }
        .hovercard.show { opacity: 1; transform: translateY(0); }
        /* Only the queue popup is interactive (hover to keep open, remove tracks);
           album-grid previews stay click-through so they don't block the grid. */
        .hovercard.interactive { pointer-events: auto; }

        .hovercard-cover {
            width: 240px;
            height: 240px;
            border-radius: 8px;
            object-fit: cover;
            display: block;
            background: var(--surface-2);
        }
        .hovercard-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-top: 10px;
            max-width: 240px;
            line-height: 1.25;
        }
        .hovercard-sub  { font-size: 13px; color: var(--text-2); margin-top: 3px; max-width: 240px; }
        .hovercard-meta { font-size: 12px; color: var(--text-3); margin-top: 5px; }

        .hovercard-tracks-head {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            padding: 0 2px 8px;
            max-width: 300px;
        }
        .hovercard-tracks { list-style: none; min-width: 220px; max-width: 320px; }
        .hovercard-tracks li {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 5px 2px;
            font-size: 12.5px;
            color: var(--text);
            border-top: 1px solid var(--border);
        }
        .hovercard-tracks li:first-child { border-top: none; }
        .hovercard-tracks .tn { color: var(--text-3); width: 20px; text-align: right; flex-shrink: 0; }
        .hovercard-tracks .tt {
            flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .hc-remove {
            margin-left: auto;
            width: 18px; height: 18px;
            flex-shrink: 0;
            border: none; border-radius: 50%;
            background: transparent;
            color: var(--text-3);
            cursor: pointer;
            font-size: 15px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            /* No transition: a fade-out leaves buttons briefly red/visible after
               the pointer moves on, which reads as "previous rows stay lit". The
               highlight must track the pointer instantly. */
        }
        /* Highlight is driven entirely by JS-managed classes (.hot / .hot-btn),
           never CSS :hover. Inside the hovercard's composited layer (transform/
           opacity transition) Safari leaves :hover stuck on rows/buttons the
           pointer has already left, so we recompute on every mousemove instead. */
        .hovercard-tracks li.hot .hc-remove { opacity: 1; }
        .hc-remove.hot-btn { background: var(--danger); color: white; }
        .hovercard-more { font-size: 12px; color: var(--text-3); padding: 7px 2px 0; }

        /* ── Scrollbars ──────────────────────────── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

        /* ── Safe area (iOS notch / home bar) ────── */
        .header {
            padding-top: env(safe-area-inset-top);
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
        }

        .player-controls {
            padding-bottom: max(0px, env(safe-area-inset-bottom));
            padding-left: max(24px, env(safe-area-inset-left));
            padding-right: max(24px, env(safe-area-inset-right));
        }

        /* ── Mobile queue toggle button (hidden on desktop) ── */
        .queue-toggle-btn {
            display: none;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: none;
            background: var(--surface-2);
            border-radius: 8px;
            color: var(--text-2);
            cursor: pointer;
            flex-shrink: 0;
            font-size: 18px;
        }

        .queue-toggle-btn.has-items { color: var(--accent); }

        .queue-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
        }

        /* ── Mobile layout ────────────────────────── */
        @media (max-width: 700px) {
            .container {
                /* minmax(0,1fr) — NOT plain 1fr — so the column can't grow past
                   the viewport when a child's min-content is wide. Plain 1fr let
                   the whole shell overflow, pushing the speaker picker off-screen
                   and shifting the (centered) transport controls right. */
                grid-template-columns: minmax(0, 1fr);
                /* Header + player size to their content; the grid (not a fixed
                   88px row) is what keeps the transport controls on-screen. */
                grid-template-rows: auto 1fr auto;
            }

            /* Spanning rows must never exceed the viewport either */
            .header, .player-controls { min-width: 0; max-width: 100%; }
            .player-controls { overflow: hidden; }

            /* Notch / status-bar inset when launched as a standalone PWA */
            .header { padding-top: env(safe-area-inset-top); }

            /* Queue becomes a slide-in panel */
            .queue-section {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: min(300px, 85vw);
                transform: translateX(-100%);
                transition: transform 0.28s ease;
                z-index: 200;
                padding-top: env(safe-area-inset-top);
            }

            .queue-section.open { transform: translateX(0); }

            .queue-overlay { display: block; opacity: 0; pointer-events: none; transition: opacity 0.28s; }
            .queue-overlay.open { opacity: 1; pointer-events: auto; }

            .queue-toggle-btn { display: flex; }

            /* Tighten header on small screens */
            .header { gap: 10px; }
            .header h1 { display: none; }
            .header-search { max-width: none; }
            .search-results { display: none; }

            /* Full-width albums */
            .albums-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 14px; }
            .genre-bar { padding: 10px 14px; }

            /* Player bar: stack now-playing above controls */
            .player-controls {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto auto;
                padding: 10px max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
                gap: 8px;
                height: auto;
            }

            .controls-center { justify-content: center; }

            .volume-control { justify-content: center; }

            .now-playing-info { min-width: 0; }

            .np-art { width: 40px; height: 40px; }
        }

        /* Keep the speaker name from pushing the header past the viewport */
        @media (max-width: 480px) {
            #speakerName { max-width: 5.5em; }
        }

        @media (max-width: 400px) {
            .sort-controls { display: none; }
            .albums-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Mobile queue overlay -->
    <div class="queue-overlay" id="queueOverlay" onclick="closeQueuePanel()"></div>

    <!-- Header -->
    <div class="header">
        <button class="queue-toggle-btn" id="queueToggleBtn" onclick="toggleQueuePanel()" title="Queue">&#9776;</button>
        <h1>Sonos</h1>
        <div class="sort-controls">
            <button class="sort-btn active" data-sort="artist">Artists</button>
            <button class="sort-btn" data-sort="title">Albums</button>
            <button class="sort-btn" data-sort="genre">Genre</button>
        </div>

        <div class="header-search">
            <input type="text" class="search-box" id="searchBox"
                   placeholder="Search…  ( \ or / )"
                   oninput="filterAlbums()" onkeydown="onSearchKey(event)">
            <span class="search-results" id="searchResults"></span>
        </div>

        <div class="speaker-picker" id="speakerPicker">
            <button class="speaker-btn" id="speakerBtn" onclick="toggleSpeakerMenu()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
                <span id="speakerName">Loading…</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="speaker-menu" id="speakerMenu"></div>
        </div>
    </div>

    <!-- Queue -->
    <div class="queue-section">
        <div class="queue-header">
            <span class="queue-label">Queue</span>
            <div class="queue-buttons">
                <button class="play-queue-btn" onclick="playQueue()">Play</button>
                <button class="clear-btn" onclick="clearQueue()">Clear</button>
            </div>
        </div>
        <div class="queue-scroll" id="queueList">
            <div class="queue-empty">
                <div class="queue-empty-icon">♫</div>
                <span>Drag albums here or click +</span>
            </div>
        </div>
    </div>

    <!-- Albums -->
    <div class="albums-section">
        <div class="genre-bar" id="genreBar"></div>
        <div class="albums-grid" id="albumsGrid">
            <div style="color:var(--text-2);padding:20px;font-size:14px;">Loading…</div>
        </div>
    </div>

    <!-- Player bar -->
    <div class="player-controls">
        <div class="now-playing-info">
            <img class="np-art" id="npArt" src="" alt="">
            <div class="np-text" id="npText"></div>
        </div>
        <div class="controls-center">
            <button class="control-btn" onclick="prevAlbum()" title="Previous album" aria-label="Previous album">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="4" y2="18"/><polygon points="14 6 8 12 14 18"/><polygon points="21 6 15 12 21 18"/></svg>
            </button>
            <button class="control-btn" onclick="previousTrack()" title="Previous track" aria-label="Previous track">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="6" y2="18"/><polygon points="18 6 9 12 18 18"/></svg>
            </button>
            <button class="control-btn play-pause" onclick="togglePlayPause()" id="playPauseBtn">&#9654;</button>
            <button class="control-btn" onclick="nextTrack()" title="Next track" aria-label="Next track">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 6 15 12 6 18"/><line x1="18" y1="6" x2="18" y2="18"/></svg>
            </button>
            <button class="control-btn" onclick="nextAlbum()" title="Next album" aria-label="Next album">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 6 9 12 3 18"/><polygon points="10 6 16 12 10 18"/><line x1="20" y1="6" x2="20" y2="18"/></svg>
            </button>
        </div>
        <div class="volume-control">
            <svg class="volume-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            <input type="range" class="volume-slider" id="volumeSlider"
                   min="0" max="100" value="50"
                   oninput="onVolumeInput(this.value)"
                   onchange="setVolume(this.value)">
            <input type="number" class="volume-label" id="volumeLabel"
                   min="0" max="100" value="50"
                   oninput="onVolumeLabelInput(this.value)"
                   onkeydown="onVolumeLabelKey(event)"
                   onblur="onVolumeLabelBlur(this.value)">
        </div>
    </div>

    <!-- Hover preview (album cover / queue tracks) -->
    <div class="hovercard" id="hovercard"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&#x2715;</button>
            <div class="modal-header">
                <img class="modal-cover" id="modalCover" src="" alt="">
                <div class="modal-info">
                    <div class="modal-title"  id="modalTitle"></div>
                    <div class="modal-artist" id="modalArtist"></div>
                    <div class="modal-genre"  id="modalGenre"></div>
                </div>
            </div>
            <div class="modal-body">
                <ul class="track-list" id="trackList"></ul>
            </div>
            <div class="modal-footer">
                <span id="trackCount"></span>
                <button class="add-to-queue-btn" id="modalAddBtn" onclick="addModalAlbumToQueue()">Add to Queue</button>
            </div>
        </div>
    </div>

</div>
<script>
    let albums         = [];
    let filteredAlbums = [];
    let queue          = [];
    let currentSort    = 'artist';
    let genreFilter    = '';
    let isPlaying      = false;
    let draggedAlbum   = null;
    let draggedQueueIndex = null;
    let currentModalAlbum = null;   // set in grid mode (enables "Add to Queue")
    let modalQueueIdx = null;        // set in queue mode (tap a queue item on touch)
    let currentPlayingAlbum = null;
    let speakerList    = [];
    let currentSpeakerIp = '';
    const artCache     = {};  // album id → base64 cover art
    let artObserver    = null;
    let isLocalMode    = false;
    let savedSonosQueue = [];  // Sonos queue saved while in local mode
    let localAudio     = null; // HTMLAudioElement, created on first local play
    let localTrackList = [];   // flat track list for local playback
    let localTrackIdx  = -1;

    // ── Helpers ──────────────────────────────────────────────────────────
    function esc(s) {
        return (String(s === null || s === undefined ? '' : s))
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function artMime(base64) {
        if (!base64) return 'image/jpeg';
        if (base64.startsWith('iVBOR')) return 'image/png';
        if (base64.startsWith('R0lGO')) return 'image/gif';
        if (base64.startsWith('UklGR')) return 'image/webp';
        return 'image/jpeg';
    }

    function artSrc(base64) {
        return base64 ? `data:${artMime(base64)};base64,${base64}` : '';
    }

    function getDeviceLabel() {
        const ua = navigator.userAgent;
        const pl = navigator.platform || '';
        if (/iPad/.test(ua) || (pl === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'This iPad';
        if (/iPhone/.test(ua)) return 'This iPhone';
        if (/Android/.test(ua)) return 'This Android';
        if (/Mac/.test(pl)) return 'This Mac';
        return 'This Device';
    }

    // ── Albums ───────────────────────────────────────────────────────────
    async function loadAlbums(sort = 'artist') {
        currentSort = sort;
        try {
            const res  = await fetch(`/api/albums?sort=${sort}`);
            const data = await res.json();
            albums = data.albums;
            if (sort === 'genre') {
                buildGenreBar();
            } else {
                document.getElementById('genreBar').style.display = 'none';
                genreFilter = '';
            }
            filterAlbums();  // applies search + genre filter, then renders
            document.querySelectorAll('.sort-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.sort === sort));
            if (currentSort === sort) {
                if (isLocalMode) loadLocalQueueState();
                else loadQueueState();
            }
        } catch (e) {
            console.error('Error loading albums:', e);
        }
    }

    function renderAlbums() {
        const grid = document.getElementById('albumsGrid');
        const list = filteredAlbums;

        if (!list.length) {
            grid.innerHTML = '<div style="color:var(--text-2);padding:20px;font-size:14px;">No albums found</div>';
            return;
        }

        grid.innerHTML = list.map(album => {
            const cached = artCache[album.id];
            const meta = [album.genre, album.year].filter(Boolean).map(esc).join('<span>·</span>');
            return `
            <div class="album-card" draggable="true" data-album-id="${album.id}"
                 ondragstart="handleDragStart(event)"
                 onclick="showAlbumDetails(${album.id})">
                <div class="album-art-wrap">
                    <img class="album-art" data-id="${album.id}"
                         src="${cached ? 'data:image/jpeg;base64,' + cached : ''}"
                         alt="${esc(album.title)}"
                         style="${cached ? '' : 'display:none'}">
                    <div class="add-overlay" draggable="false">
                        <button class="add-btn" draggable="false"
                                onclick="addAlbumToQueue(${album.id}, event)"
                                title="Add to queue">+</button>
                    </div>
                </div>
                <div class="a-title">${esc(album.title)}</div>
                <div class="a-artist">${esc(album.artist || 'Unknown')}</div>
                ${meta ? `<div class="a-meta">${meta}</div>` : ''}
            </div>`;
        }).join('');

        setupArtObserver();
    }

    // ── Lazy cover art ────────────────────────────────────────────────────
    function setupArtObserver() {
        if (artObserver) artObserver.disconnect();
        artObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const card = entry.target;
                const id   = parseInt(card.dataset.albumId);
                artObserver.unobserve(card);
                fetchArt(id, card);
            });
        }, { rootMargin: '200px' });  // start loading 200px before visible

        document.querySelectorAll('.album-card').forEach(card => {
            const id = parseInt(card.dataset.albumId);
            if (artCache[id]) {
                applyArt(card, artCache[id]);
            } else {
                artObserver.observe(card);
            }
        });
    }

    async function fetchArt(id, card) {
        if (artCache[id] !== undefined) { applyArt(card, artCache[id]); return; }
        try {
            const res  = await fetch(`/api/albums/${id}/art`);
            const data = await res.json();
            const art  = data.cover_art || null;
            artCache[id] = art;
            // Backfill the in-memory album object so queue/modal art works
            const album = albums.find(a => a.id === id);
            if (album) album.cover_art = art;
            applyArt(card, art);
        } catch (e) { artCache[id] = null; }
    }

    function applyArt(card, base64) {
        if (!card || !base64) return;
        const img = card.querySelector('img.album-art');
        if (img) { img.src = artSrc(base64); img.style.display = 'block'; }
    }

    function filterAlbums() {
        const term = document.getElementById('searchBox').value.toLowerCase().trim();
        filteredAlbums = albums.filter(a => {
            if (genreFilter && (a.genre || 'Unknown') !== genreFilter) return false;
            if (!term) return true;
            return (a.title  || '').toLowerCase().includes(term) ||
                   (a.artist || '').toLowerCase().includes(term) ||
                   (a.genre  || '').toLowerCase().includes(term);
        });
        renderAlbums();
        updateSearchResults();
    }

    function updateSearchResults() {
        const term = document.getElementById('searchBox').value.trim();
        document.getElementById('searchResults').textContent = (term || genreFilter)
            ? `${filteredAlbums.length} of ${albums.length} albums`
            : `${albums.length} albums`;
    }

    // Build the clickable genre chips (shown in Genre mode) from the library's genres
    function buildGenreBar() {
        const bar = document.getElementById('genreBar');
        const counts = {};
        albums.forEach(a => { const g = a.genre || 'Unknown'; counts[g] = (counts[g] || 0) + 1; });
        if (genreFilter && !counts[genreFilter]) genreFilter = '';
        const genres = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
        bar.innerHTML =
            `<button class="genre-chip ${genreFilter === '' ? 'active' : ''}" data-genre="">All <span class="gc-count">${albums.length}</span></button>` +
            genres.map(g =>
                `<button class="genre-chip ${genreFilter === g ? 'active' : ''}" data-genre="${esc(g)}">${esc(g)} <span class="gc-count">${counts[g]}</span></button>`
            ).join('');
        bar.style.display = 'flex';
        bar.querySelectorAll('.genre-chip').forEach(chip =>
            chip.addEventListener('click', () => {
                genreFilter = chip.dataset.genre;
                bar.querySelectorAll('.genre-chip').forEach(c =>
                    c.classList.toggle('active', c.dataset.genre === genreFilter));
                filterAlbums();
            }));
    }

    // ── Queue ─────────────────────────────────────────────────────────────
    function renderQueue() {
        updateQueueToggle();
        const el = document.getElementById('queueList');
        if (!queue.length) {
            el.innerHTML = `<div class="queue-empty">
                <div class="queue-empty-icon">♫</div>
                <span>Drag albums here or click +</span>
            </div>`;
            return;
        }
        el.innerHTML = queue.map((album, i) => {
            const playing = currentPlayingAlbum && currentPlayingAlbum.id === album.id;
            return `
            <div class="queue-item ${playing ? 'now-playing' : ''}"
                 data-queue-index="${i}" draggable="true"
                 onclick="showQueueDetails(${i})"
                 ondragstart="handleQueueDragStart(event)"
                 ondragend="handleQueueDragEnd(event)">
                <div class="playing-indicator"></div>
                ${artSrc(album.cover_art)
                    ? `<img src="${artSrc(album.cover_art)}" alt="${esc(album.title)}">`
                    : `<div style="width:42px;height:42px;border-radius:5px;background:var(--surface-3);flex-shrink:0"></div>`}
                <div class="queue-item-info">
                    <div class="q-title">${esc(album.title)}</div>
                    <div class="q-artist">${esc(album.artist || 'Unknown')}</div>
                </div>
                <button class="remove-btn"
                        onclick="removeFromQueue(${i}); event.stopPropagation();"
                        title="Remove">&#x2715;</button>
            </div>`;
        }).join('');
    }

    async function addAlbumToQueue(albumId, event) {
        if (event) event.stopPropagation();
        const album = filteredAlbums.find(a => a.id === albumId) || albums.find(a => a.id === albumId);
        if (!album) return;
        queue.push(album);
        renderQueue();
        if (isLocalMode) { saveLocalQueueState(); return; }
        saveQueueState();
        try {
            const res = await fetch(`/api/queue/add/${album.id}`, { method: 'POST' });
            const result = await res.json();
            if (!res.ok) {
                alert(`Error: ${result.error}\n\n${result.suggestion || ''}`);
                queue.pop();
                renderQueue();
                saveQueueState();
            }
        } catch (e) {
            alert('Error connecting to Sonos');
            queue.pop();
            renderQueue();
            saveQueueState();
        }
    }

    async function clearQueue() {
        queue = [];
        renderQueue();
        if (isLocalMode) { saveLocalQueueState(); return; }
        saveQueueState();
        try { await fetch('/api/queue/clear', { method: 'POST' }); }
        catch (e) { console.error(e); }
    }

    async function playQueue() {
        if (isLocalMode) { await localPlayQueue(); return; }
        try {
            const res = await fetch('/api/queue/play', { method: 'POST' });
            const result = await res.json();
            if (!res.ok) { alert(`Error: ${result.error}`); return; }
            isPlaying = true;
            document.getElementById('playPauseBtn').innerHTML = '&#9646;&#9646;';
        } catch (e) { alert('Error starting playback'); }
    }

    async function removeFromQueue(index) {
        queue.splice(index, 1);
        renderQueue();
        if (isLocalMode) { saveLocalQueueState(); return; }
        // Remove just this album's tracks from Sonos in place (preserves the
        // currently-playing track). Must hit the endpoint before saveQueueState
        // so the server still sees the pre-removal sidebar order for its guard.
        let removed = false;
        try {
            const res = await fetch(`/api/queue/remove/${index}`, { method: 'POST' });
            removed = res.ok;
        } catch (e) { console.error(e); }
        // Only if the surgical remove failed (queue drifted) do we rebuild,
        // which restarts playback — the lesser evil versus a wrong queue.
        if (!removed) await resyncSonosQueue();
        saveQueueState();
    }

    function saveQueueState() {
        fetch('/api/queue/state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ album_ids: queue.map(a => a.id) })
        }).catch(e => console.error('Error saving queue state:', e));
    }

    async function loadQueueState() {
        try {
            const res  = await fetch('/api/queue/state');
            const saved = await res.json();
            if (saved.length) {
                queue = saved;
                renderQueue();
            }
        } catch (e) { console.error('Error loading queue state:', e); }
    }

    function saveLocalQueueState() {
        try { localStorage.setItem('localQueue', JSON.stringify(queue.map(a => a.id))); }
        catch (e) { console.error(e); }
    }

    function loadLocalQueueState() {
        try {
            const ids = JSON.parse(localStorage.getItem('localQueue') || '[]');
            if (!ids.length) return;
            const restored = ids.map(id => albums.find(a => a.id === id)).filter(Boolean);
            if (restored.length) { queue = restored; renderQueue(); }
        } catch (e) { console.error(e); }
    }

    // ── Drag and drop ─────────────────────────────────────────────────────
    function handleDragStart(event) {
        const id = parseInt(event.currentTarget.dataset.albumId);
        draggedAlbum = filteredAlbums.find(a => a.id === id) || albums.find(a => a.id === id);
        event.dataTransfer.effectAllowed = 'copy';
    }

    function handleQueueDragStart(event) {
        draggedQueueIndex = parseInt(event.currentTarget.dataset.queueIndex);
        event.dataTransfer.setData('queueIndex', event.currentTarget.dataset.queueIndex);
        event.dataTransfer.effectAllowed = 'move';
        event.currentTarget.style.opacity = '0.4';
    }

    function handleQueueDragEnd(event) {
        event.currentTarget.style.opacity = '';
        draggedQueueIndex = null;
        clearDropMarkers();
    }

    const queueEl = document.getElementById('queueList');

    queueEl.addEventListener('dragover', e => {
        e.preventDefault();
        if (draggedQueueIndex !== null) {           // reordering an existing item
            e.dataTransfer.dropEffect = 'move';
            showDropMarker(computeDropIndex(e.clientY));
        } else {                                     // dropping a new album from the grid
            e.dataTransfer.dropEffect = 'copy';
            queueEl.classList.add('drag-over');
        }
    });

    queueEl.addEventListener('dragleave', e => {
        if (!queueEl.contains(e.relatedTarget)) {    // only when truly leaving the list
            queueEl.classList.remove('drag-over');
            clearDropMarkers();
        }
    });

    queueEl.addEventListener('drop', async e => {
        e.preventDefault();
        queueEl.classList.remove('drag-over');
        if (draggedQueueIndex !== null) {
            const to = computeDropIndex(e.clientY);
            clearDropMarkers();
            await moveQueueItem(draggedQueueIndex, to);
            draggedQueueIndex = null;
        } else if (draggedAlbum) {
            await addAlbumToQueue(draggedAlbum.id, null);
        }
        draggedAlbum = null;
    });

    // Where in the queue a drop at pointer-Y would land
    function computeDropIndex(y) {
        const items = [...queueEl.querySelectorAll('.queue-item')];
        for (let i = 0; i < items.length; i++) {
            const r = items[i].getBoundingClientRect();
            if (y < r.top + r.height / 2) return i;
        }
        return items.length;
    }

    function showDropMarker(index) {
        clearDropMarkers();
        const items = queueEl.querySelectorAll('.queue-item');
        if (!items.length) return;
        if (index >= items.length) items[items.length - 1].classList.add('drop-after');
        else items[index].classList.add('drop-before');
    }

    function clearDropMarkers() {
        queueEl.querySelectorAll('.drop-before, .drop-after')
            .forEach(el => el.classList.remove('drop-before', 'drop-after'));
    }

    // Rebuild the Sonos queue to match the current local order
    async function resyncSonosQueue() {
        try {
            await fetch('/api/queue/clear', { method: 'POST' });
            for (const a of queue) await fetch(`/api/queue/add/${a.id}`, { method: 'POST' });
        } catch (e) { console.error(e); }
    }

    async function moveQueueItem(from, to) {
        const target = to > from ? to - 1 : to;
        if (target === from) return;                 // dropped in place, nothing to do
        // Optimistic local reorder; defer saveQueueState until after the move so
        // the server still sees the pre-move sidebar order for its drift guard.
        const [item] = queue.splice(from, 1);
        queue.splice(target, 0, item);
        renderQueue();
        if (isLocalMode) { saveLocalQueueState(); return; }
        // Reorder the Sonos queue in place (preserves playback + per-track removals).
        let moved = false;
        try {
            const res = await fetch('/api/queue/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ from, to })
            });
            moved = res.ok;
        } catch (e) { console.error(e); }
        // Fall back to a full rebuild only if the in-place move failed (queue drifted).
        if (!moved) await resyncSonosQueue();
        saveQueueState();
    }

    // ── Player controls ───────────────────────────────────────────────────
    async function togglePlayPause() {
        if (isLocalMode) {
            if (!localAudio || localTrackIdx < 0) {
                if (queue.length) await localPlayQueue();
            } else if (localAudio.paused) {
                localAudio.play().catch(e => console.error(e));
            } else {
                localAudio.pause();
            }
            return;
        }
        const endpoint = isPlaying ? '/api/player/pause' : '/api/player/play';
        try {
            await fetch(endpoint, { method: 'POST' });
            isPlaying = !isPlaying;
            document.getElementById('playPauseBtn').innerHTML = isPlaying ? '&#9646;&#9646;' : '&#9654;';
        } catch (e) { console.error(e); }
    }

    async function updatePlayerStatus() {
        if (isLocalMode) return;
        try {
            const res    = await fetch('/api/player/status');
            const status = await res.json();
            if (!status.state) return;

            isPlaying = status.state === 'PLAYING';
            document.getElementById('playPauseBtn').innerHTML = isPlaying ? '&#9646;&#9646;' : '&#9654;';

            const artEl  = document.getElementById('npArt');
            const textEl = document.getElementById('npText');

            if (status.track) {
                textEl.innerHTML = `
                    <div class="np-title">${esc(status.track)}</div>
                    <div class="np-artist">${esc(status.artist || '')}</div>`;

                // Try to match album art from our library
                const matched = albums.find(a =>
                    a.title && status.album && a.title.toLowerCase() === status.album.toLowerCase()
                ) || albums.find(a =>
                    a.artist && status.artist && a.artist.toLowerCase() === status.artist.toLowerCase()
                );

                if (matched !== currentPlayingAlbum) {
                    currentPlayingAlbum = matched || null;
                    renderQueue();
                }

                if (matched) {
                    const art = matched.cover_art || artCache[matched.id];
                    if (art) {
                        artEl.src = artSrc(art);
                        artEl.style.visibility = 'visible';
                    } else {
                        // Art not loaded yet — fetch it
                        artEl.style.visibility = 'hidden';
                        fetch(`/api/albums/${matched.id}/art`)
                            .then(r => r.json())
                            .then(d => {
                                if (d.cover_art) {
                                    artCache[matched.id] = d.cover_art;
                                    matched.cover_art = d.cover_art;
                                    artEl.src = artSrc(d.cover_art);
                                    artEl.style.visibility = 'visible';
                                }
                            }).catch(() => {});
                    }
                } else {
                    artEl.style.visibility = 'hidden';
                }
            } else {
                textEl.innerHTML = '';
                artEl.style.visibility = 'hidden';
            }
        } catch (e) { /* silently ignore */ }
    }

    // Compact button label: "Living Room +2" (full name shown on hover via title)
    function setSpeakerLabel(s) {
        const el = document.getElementById('speakerName');
        const parts = (s.label || '').split(' + ');
        el.textContent = parts.length > 1 ? `${parts[0]} +${parts.length - 1}` : s.label;
        el.parentElement.title = s.label;
    }

    async function selectSpeaker(ip) {
        document.getElementById('speakerMenu').classList.remove('open');

        if (ip === '__local__') {
            if (!isLocalMode) savedSonosQueue = [...queue];
            isLocalMode = true;
            localStorage.setItem('localMode', 'true');
            queue = [];
            renderQueue();
            loadLocalQueueState();
            const label = getDeviceLabel();
            document.getElementById('speakerName').textContent = label;
            document.getElementById('speakerBtn').title = label;
            document.querySelectorAll('.speaker-option').forEach(el =>
                el.classList.toggle('active', el.dataset.coordinatorIp === '__local__'));
            syncVolume();
            return;
        }

        if (isLocalMode) {
            saveLocalQueueState();
            if (localAudio) localAudio.pause();
            isLocalMode = false;
            localStorage.removeItem('localMode');
            isPlaying = false;
            document.getElementById('playPauseBtn').innerHTML = '&#9654;';
            document.getElementById('npText').innerHTML = '';
            document.getElementById('npArt').style.visibility = 'hidden';
            currentPlayingAlbum = null;
        }

        const s = speakerList.find(sp => sp.coordinator_ip === ip);
        if (s) setSpeakerLabel(s);
        currentSpeakerIp = ip;
        document.querySelectorAll('.speaker-option').forEach(el => {
            el.classList.toggle('active', el.dataset.coordinatorIp === ip);
        });
        try {
            await fetch('/api/speaker/select', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip })
            });
            // Queue is per-speaker — reload for the newly selected room
            queue = [];
            renderQueue();
            await loadQueueState();
            syncVolume();
        } catch (e) { console.error(e); }
    }

    // ── Modal ─────────────────────────────────────────────────────────────
    async function showAlbumDetails(albumId) {
        const album = filteredAlbums.find(a => a.id === albumId) || albums.find(a => a.id === albumId);
        if (!album) return;
        hideHover();
        currentModalAlbum = album;
        modalQueueIdx = null;
        document.getElementById('modalAddBtn').style.display = '';   // grid mode: allow adding

        const img = artSrc(album.cover_art);
        document.getElementById('modalCover').src    = img;
        document.getElementById('modalTitle').textContent  = album.title;
        document.getElementById('modalArtist').textContent = album.artist || 'Unknown Artist';
        document.getElementById('modalGenre').textContent  = album.genre  || '';

        try {
            const res    = await fetch(`/api/albums/${albumId}/tracks`);
            const tracks = await res.json();

                <li class="track-item">

    // Tap a queue item (touch-friendly path to the tracklist + per-track remove).
    async function showQueueDetails(idx) {
        const album = queue[idx];
        if (!album) return;
        hideHover();
        currentModalAlbum = null;
        modalQueueIdx = idx;
        document.getElementById('modalAddBtn').style.display = 'none';  // already queued

        document.getElementById('modalCover').src = artSrc(album.cover_art || artCache[album.id]);
        document.getElementById('modalTitle').textContent  = album.title;
        document.getElementById('modalArtist').textContent = album.artist || 'Unknown Artist';
        document.getElementById('modalGenre').textContent  = album.genre  || '';

        await renderModalQueueTracks(idx);
        document.getElementById('modalOverlay').classList.add('active');
    }

    async function renderModalQueueTracks(idx) {
        let tracks = [];
        try {
            if (isLocalMode) {
                const album = queue[idx];
                if (album) {
                    const data = await fetch(`/api/albums/${album.id}/tracks`).then(r => r.json());
                    tracks = data.map(t => ({ number: t.track_number, title: t.title, track_index: t.id }));
                }
            } else {
                const data = await fetch(`/api/queue/album/${idx}/tracks`).then(r => r.json());
                tracks = data.tracks || [];
            }
        } catch (e) { console.error(e); }
        document.getElementById('trackList').innerHTML = tracks.map(t => `
            <li class="track-item">
                <span class="track-number">${t.number || '·'}</span>
                <span class="track-title">${esc(t.title)}</span>
                ${isLocalMode ? '' : `<button class="track-remove" title="Remove from queue"
                        onclick="removeModalQueueTrack(${idx}, ${t.track_index})">&minus;</button>`}
            </li>`).join('');
        document.getElementById('trackCount').textContent =
            `${tracks.length} track${tracks.length === 1 ? '' : 's'}${isLocalMode ? '' : ' in queue'}`;
    }

    async function removeModalQueueTrack(idx, trackIndex) {
        let result;
        try {
            const res = await fetch(`/api/queue/album/${idx}/remove_track/${trackIndex}`,
                                    { method: 'POST' });
            if (!res.ok) { console.error('remove_track failed', res.status); return; }
            result = await res.json();
        } catch (e) { console.error(e); return; }

        if (result.album_empty) {
            queue.splice(idx, 1);
            renderQueue();
            saveQueueState();
            closeModal();
        } else {
            renderModalQueueTracks(idx);   // re-fetch so indices stay correct
        }
    }

    // ── Volume ────────────────────────────────────────────────────────────
    let volumeDebounce = null;

    function setVolume(val) {

    function onVolumeLabelKey(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            const v = Math.max(0, Math.min(100, parseInt(event.target.value) || 0));
            event.target.value = v;
            document.getElementById('volumeSlider').value = v;
            setVolume(v);
            event.target.blur();
        } else if (event.key === 'Escape') {

        const v = Math.max(0, Math.min(100, parseInt(val) || 0));
        document.getElementById('volumeLabel').value = v;
        document.getElementById('volumeSlider').value = v;
        setVolume(v);

    async function syncVolume() {
