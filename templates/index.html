    // Kick off an incremental library rescan in the background. The grid has
    // already rendered from the current DB, so this never delays launch; if the
    // scan finds changes we quietly refresh the grid when it finishes.
    async function backgroundRescan() {
        try {
            const res  = await fetch('/api/rescan', { method: 'POST' });
            const data = await res.json();
            if (data.status !== 'started') return;  // skipped (cooldown) or already running

            // Poll for completion (up to ~40s), then refresh only if something changed.
            for (let i = 0; i < 20; i++) {
                await new Promise(r => setTimeout(r, 2000));
                const s = await (await fetch('/api/rescan/status')).json();
                if (!s.running) {
                    const r = s.last_result || {};
                    if ((r.added || 0) + (r.updated || 0) + (r.removed || 0) > 0) {
                        loadAlbums(currentSort);
                    }
                    return;
                }
            }
        } catch (e) {
            console.error('Background rescan failed:', e);
        }
    }

    // ── Hover previews (album cover + queue tracks) ───────────────────────
    let hoverTimer = null, hoverKey = null, isDragging = false, hideTimer = null;

    // A short grace period before hiding lets the pointer travel from a queue
    // item onto its (interactive) popup without the popup vanishing en route.
    function cancelHide() { clearTimeout(hideTimer); hideTimer = null; }
    function scheduleHide() { clearTimeout(hideTimer); hideTimer = setTimeout(hideHover, 160); }
    function clearHotTrack() {
        document.querySelectorAll('.hovercard-tracks li.hot')
            .forEach(li => li.classList.remove('hot'));
        document.querySelectorAll('.hc-remove.hot-btn')
            .forEach(b => b.classList.remove('hot-btn'));
    }

    // Recompute the single highlighted row (and remove button) from the pointer's
    // position. mousemove fires on every movement and is reliable in Safari, so
    // stale highlights self-correct — unlike CSS :hover in a composited layer.
    function updateHotTrack(target) {
        const li  = target.closest ? target.closest('.hovercard-tracks li') : null;
        const btn = target.closest ? target.closest('.hc-remove') : null;
        document.querySelectorAll('.hovercard-tracks li.hot')
            .forEach(l => { if (l !== li) l.classList.remove('hot'); });
        if (li) li.classList.add('hot');
        document.querySelectorAll('.hc-remove.hot-btn')
            .forEach(b => { if (b !== btn) b.classList.remove('hot-btn'); });
        if (btn) btn.classList.add('hot-btn');
    }

    function placeHover(rect, forceLeft) {
        const hc = document.getElementById('hovercard');
        hc.style.display = 'block';               // make measurable
        const w = hc.offsetWidth, h = hc.offsetHeight, m = 10;
        const vw = innerWidth, vh = innerHeight;
        const roomRight = (vw - rect.right - m) >= w;
        let x;
        if (!forceLeft && roomRight)        x = rect.right + m;
        else if ((rect.left - m) >= w)      x = rect.left - m - w;
        else                                x = roomRight ? rect.right + m : m;
        x = Math.max(m, Math.min(x, vw - w - m));
        let y = rect.top + rect.height / 2 - h / 2;
        y = Math.max(m, Math.min(y, vh - h - m));
        hc.style.left = x + 'px';
        hc.style.top  = y + 'px';
        requestAnimationFrame(() => hc.classList.add('show'));
    }

    function hideHover() {
        clearTimeout(hoverTimer); hoverTimer = null; hoverKey = null;
        clearTimeout(hideTimer);  hideTimer  = null;
        const hc = document.getElementById('hovercard');
        hc.classList.remove('show');
        setTimeout(() => {
            if (!hc.classList.contains('show')) {
                hc.style.display = 'none';
                hc.classList.remove('interactive');
            }
        }, 160);
    }

    function scheduleAlbumHover(card) {
        if (isDragging) return;
        cancelHide();
        const id = parseInt(card.dataset.albumId);
        if (hoverKey === 'a' + id) return;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => {
            const album = albums.find(a => a.id === id);
            if (!album) return;
            hoverKey = 'a' + id;
            const art  = album.cover_art || artCache[id];
            const meta = [album.genre, album.year, album.track_count ? album.track_count + ' tracks' : '']
                .filter(Boolean).map(esc).join('  ·  ');
            const hc = document.getElementById('hovercard');
            hc.classList.remove('interactive');
            hc.innerHTML =
                (art ? `<img class="hovercard-cover" src="${artSrc(art)}" alt="">`
                     : `<div class="hovercard-cover"></div>`) +
                `<div class="hovercard-title">${esc(album.title)}</div>` +
                `<div class="hovercard-sub">${esc(album.artist || 'Unknown Artist')}</div>` +
                (meta ? `<div class="hovercard-meta">${meta}</div>` : '');
            placeHover(card.getBoundingClientRect(), false);
        }, 500);
    }

    function scheduleQueueHover(item) {
        if (isDragging) return;
        cancelHide();
        const idx = parseInt(item.dataset.queueIndex);
        const album = queue[idx];
        if (!album) return;
        if (hoverKey === 'q' + album.id) return;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => {
            hoverKey = 'q' + album.id;
            renderQueueHover(idx, true);
        }, 500);
    }

    // Fill the popup with the album's *actual* queued tracks (from Sonos, not the
    // catalog) plus a per-track remove control. reposition=true on first open;
    // false when re-rendering in place after a removal (avoids the card jumping).
    async function renderQueueHover(idx, reposition) {
        const album = queue[idx];
        if (!album) { hideHover(); return; }
        const key = 'q' + album.id;
        let tracks, albumTitle;
        if (isLocalMode) {
            try {
                const data = await fetch(`/api/albums/${album.id}/tracks`).then(r => r.json());
                tracks = data.map(t => ({ number: t.track_number, title: t.title, track_index: t.id }));
                albumTitle = album.title;
            } catch (e) { tracks = []; albumTitle = album.title; }
        } else {
            let data;
            try { data = await (await fetch(`/api/queue/album/${idx}/tracks`)).json(); }
            catch (e) { data = { tracks: [] }; }
            tracks = data.tracks || [];
            albumTitle = data.album || album.title;
        }
        if (hoverKey !== key) return;             // moved away while fetching
        const hc = document.getElementById('hovercard');
        hc.classList.add('interactive');
        hc.innerHTML =
            `<div class="hovercard-tracks-head">${esc(albumTitle)}</div>` +
            `<ul class="hovercard-tracks">` +
            tracks.map(t => `<li>
                <span class="tn">${t.number || '·'}</span>
                <span class="tt">${esc(t.title)}</span>
                ${isLocalMode ? '' : `<button class="hc-remove" title="Remove track from queue"
                        onclick="removeQueueTrack(${idx}, ${t.track_index})">&minus;</button>`}
            </li>`).join('') +
            `</ul>` +
            (tracks.length ? '' : `<div class="hovercard-more">No tracks</div>`);
        if (reposition) {
            const el = document.querySelector(`.queue-item[data-queue-index="${idx}"]`);
            if (el) placeHover(el.getBoundingClientRect(), false);
        }
    }

    async function removeQueueTrack(idx, trackIndex) {
        cancelHide();
        let result;
        try {
            const res = await fetch(`/api/queue/album/${idx}/remove_track/${trackIndex}`,
                                    { method: 'POST' });
            if (!res.ok) { console.error('remove_track failed', res.status); return; }
            result = await res.json();
        } catch (e) { console.error(e); return; }

        if (result.album_empty) {
            // Last track gone — drop the album from the sidebar too.
            queue.splice(idx, 1);
            renderQueue();
            saveQueueState();
            hideHover();
        } else {
            // Re-fetch so the remaining tracks' indices stay correct.
            renderQueueHover(idx, false);
        }
    }

    // Only wire hover previews on devices that actually hover (skip touch)
    if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
        const grid = document.getElementById('albumsGrid');
        grid.addEventListener('mouseover', e => {
            const c = e.target.closest('.album-card');
            if (c) scheduleAlbumHover(c); else scheduleHide();
        });
        grid.addEventListener('mouseleave', scheduleHide);

        const qlist = document.getElementById('queueList');
        qlist.addEventListener('mouseover', e => {
            const it = e.target.closest('.queue-item');
            if (it) scheduleQueueHover(it); else scheduleHide();
        });
        qlist.addEventListener('mouseleave', scheduleHide);

        // Moving onto the (queue) popup keeps it open; leaving it hides it.
        const hc = document.getElementById('hovercard');
        hc.addEventListener('mouseenter', cancelHide);
        hc.addEventListener('mouseleave', () => { clearHotTrack(); scheduleHide(); });
        // Recompute the highlighted row/button on every move (see updateHotTrack).
        hc.addEventListener('mousemove', e => updateHotTrack(e.target));

        document.querySelector('.albums-section').addEventListener('scroll', hideHover, { passive: true });
        qlist.addEventListener('scroll', hideHover, { passive: true });
    }

    document.addEventListener('dragstart', () => { isDragging = true; hideHover(); });
    document.addEventListener('dragend',   () => { isDragging = false; });

    // ── Local playback engine ─────────────────────────────────────────────
    function initLocalAudio() {
        if (localAudio) return;
        localAudio = new Audio();
        localAudio.addEventListener('play', () => {
            isPlaying = true;
            document.getElementById('playPauseBtn').innerHTML = '&#9646;&#9646;';
        });
        localAudio.addEventListener('pause', () => {
            isPlaying = false;
            document.getElementById('playPauseBtn').innerHTML = '&#9654;';
        });
        localAudio.addEventListener('ended', () => {
            if (localTrackIdx + 1 < localTrackList.length) {
                localPlayTrack(localTrackIdx + 1);
            } else {
                isPlaying = false;
                localTrackIdx = -1;
                document.getElementById('playPauseBtn').innerHTML = '&#9654;';
            }
        });
        localAudio.addEventListener('error', () => {
            console.error('Local audio error on track', localTrackIdx);
            if (localTrackIdx + 1 < localTrackList.length) localPlayTrack(localTrackIdx + 1);
        });
    }

    async function localPlayQueue() {
        if (!queue.length) return;
        initLocalAudio();
        localTrackList = [];
        for (const album of queue) {
            try {
                const tracks = await fetch(`/api/albums/${album.id}/tracks`).then(r => r.json());
                for (const t of tracks) {
                    localTrackList.push({
                        id: t.id,
                        title: t.title || '',
                        artist: album.artist || '',
                        albumTitle: album.title || '',
                        albumArt: album.cover_art || artCache[album.id] || null,
                        albumId: album.id
                    });
                }
            } catch (e) { console.error('Error fetching tracks for', album.title, e); }
        }
        if (localTrackList.length) localPlayTrack(0);
    }

    function localPlayTrack(idx) {
        if (!localAudio || idx < 0 || idx >= localTrackList.length) return;
        localTrackIdx = idx;
        const t = localTrackList[idx];
        localAudio.src = `/stream/${t.id}`;
        localAudio.play().catch(e => console.error('Local play error:', e));
        updateLocalNowPlaying(t);
        setMediaSession(t);
    }

    function updateLocalNowPlaying(t) {
        const artEl  = document.getElementById('npArt');
        const textEl = document.getElementById('npText');
        textEl.innerHTML = `
            <div class="np-title">${esc(t.title)}</div>
            <div class="np-artist">${esc(t.artist)}</div>`;
        if (t.albumArt) {
            artEl.src = artSrc(t.albumArt);
            artEl.style.visibility = 'visible';
        } else {
            artEl.style.visibility = 'hidden';
        }
        const matched = albums.find(a => a.id === t.albumId);
        if (matched !== currentPlayingAlbum) {
            currentPlayingAlbum = matched || null;
            renderQueue();
        }
    }

    function setMediaSession(t) {
        if (!('mediaSession' in navigator)) return;
        navigator.mediaSession.metadata = new MediaMetadata({
            title: t.title,
            artist: t.artist,
            album: t.albumTitle,
            artwork: t.albumArt
                ? [{ src: artSrc(t.albumArt), sizes: '512x512', type: artMime(t.albumArt) }]
                : []
        });
        navigator.mediaSession.setActionHandler('play',          () => localAudio.play());
        navigator.mediaSession.setActionHandler('pause',         () => localAudio.pause());
        navigator.mediaSession.setActionHandler('nexttrack',     () => localNextTrack());
        navigator.mediaSession.setActionHandler('previoustrack', () => localPrevTrack());
        navigator.mediaSession.setActionHandler('seekto',        d => { localAudio.currentTime = d.seekTime; });
    }

    function localNextTrack() {
        if (localTrackIdx + 1 < localTrackList.length) localPlayTrack(localTrackIdx + 1);
    }

    function localPrevTrack() {
        if (localAudio && localAudio.currentTime > 3) {
            localAudio.currentTime = 0;
        } else if (localTrackIdx > 0) {
            localPlayTrack(localTrackIdx - 1);
        }
    }

    function localNextAlbum() {
        if (!localTrackList.length || localTrackIdx < 0) return;
        const curId = localTrackList[localTrackIdx].albumId;
        const next  = localTrackList.findIndex((t, i) => i > localTrackIdx && t.albumId !== curId);
        if (next >= 0) localPlayTrack(next);
    }

    function localPrevAlbum() {
        if (!localTrackList.length || localTrackIdx < 0) return;
        const curId    = localTrackList[localTrackIdx].albumId;
        const curStart = localTrackList.findIndex(t => t.albumId === curId);
        if (localTrackIdx > curStart) { localPlayTrack(curStart); return; }
        if (curStart === 0) return;
        const prevId    = localTrackList[curStart - 1].albumId;
        const prevStart = localTrackList.findIndex(t => t.albumId === prevId);
        localPlayTrack(prevStart);
    }

    // ── Init ──────────────────────────────────────────────────────────────
    if (localStorage.getItem('localMode') === 'true') isLocalMode = true;
    loadAlbums();
    loadSpeakers();
    updatePlayerStatus();
    if (!isLocalMode) syncVolume();
    setInterval(updatePlayerStatus, 2000);
    setInterval(syncVolume, 10000);
    backgroundRescan();

    // ── Service worker ────────────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
            .then(r => console.log('SW registered:', r.scope))
            .catch(e => console.warn('SW registration failed:', e));
    }
</script>
</body>
</html>
